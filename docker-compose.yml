services:
  db:
    image: postgres:16-alpine
    container_name: pedidos_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pedidos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pedidos}
      POSTGRES_DB: ${POSTGRES_DB:-pedidos}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pedidos_pgdata:/var/lib/postgresql/data
      - ./db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pedidos} -d ${POSTGRES_DB:-pedidos}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    container_name: pedidos_api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 3000
      DATABASE_URL: postgres://${POSTGRES_USER:-pedidos}:${POSTGRES_PASSWORD:-pedidos}@db:5432/${POSTGRES_DB:-pedidos}
      JWT_SECRET: ${JWT_SECRET:-change-me-in-prod}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-12h}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
      UPLOAD_DIR: /app/uploads
    ports:
      - "${API_PORT:-3000}:3000"
    volumes:
      - pedidos_uploads:/app/uploads

  web:
    build: ./frontend
    container_name: pedidos_web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "${WEB_PORT:-8080}:80"
    volumes:
      - pedidos_uploads:/usr/share/nginx/html/uploads:ro

  adminer:
    image: adminer:4.8.1-standalone
    container_name: pedidos_adminer
    restart: unless-stopped
    depends_on:
      - db
    environment:
      ADMINER_DEFAULT_SERVER: db
      ADMINER_DESIGN: dracula
    ports:
      - "${ADMINER_PORT:-8081}:8080"

volumes:
  pedidos_pgdata:
  pedidos_uploads:
