services:
  db:
    image: postgres:16-alpine
    container_name: pedidos_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pedidos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pedidos}
      POSTGRES_DB: ${POSTGRES_DB:-pedidos}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pedidos_pgdata:/var/lib/postgresql/data
      # El schema y el seed los aplica el API al arrancar (src/config/migrate.js),
      # no el initdb de Postgres. Asi tambien corren las migraciones nuevas
      # sobre una base que ya existia.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pedidos} -d ${POSTGRES_DB:-pedidos}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    container_name: pedidos_api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 3000
      DATABASE_URL: postgres://${POSTGRES_USER:-pedidos}:${POSTGRES_PASSWORD:-pedidos}@db:5432/${POSTGRES_DB:-pedidos}
      JWT_SECRET: ${JWT_SECRET:-change-me-in-prod}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-12h}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
      SUPERADMIN_EMAIL: ${SUPERADMIN_EMAIL:-lonzo.francisco.lonzo@gmail.com}
      SUPERADMIN_PASSWORD: ${SUPERADMIN_PASSWORD:-superadmin123}
      SUPERADMIN_JWT_EXPIRES_IN: ${SUPERADMIN_JWT_EXPIRES_IN:-8h}
      UPLOAD_DIR: /app/uploads
      APP_NAME: ${APP_NAME:-Pedidos Rapidos}
      SMTP_HOST: ${SMTP_HOST:-smtp-relay.brevo.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-tu-email@gmail.com}
      SMTP_PASS: ${SMTP_PASS:-tu-api-key-brevo}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      EMAIL_FROM: ${EMAIL_FROM:-Pedidos Rapidos <noreply@pedidos.local>}
      MP_ACCESS_TOKEN: ${MP_ACCESS_TOKEN:-}
      MP_PLAN_PRICE: ${MP_PLAN_PRICE:-0}
      MP_PLAN_DAYS: ${MP_PLAN_DAYS:-30}
      MP_PLAN_CURRENCY: ${MP_PLAN_CURRENCY:-ARS}
    ports:
      - "${API_PORT:-3000}:3000"
    volumes:
      - pedidos_uploads:/app/uploads

  web:
    build: ./frontend
    container_name: pedidos_web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "${WEB_PORT:-8080}:80"
    volumes:
      - pedidos_uploads:/usr/share/nginx/html/uploads:ro

  adminer:
    image: adminer:4.8.1-standalone
    container_name: pedidos_adminer
    restart: unless-stopped
    depends_on:
      - db
    environment:
      ADMINER_DEFAULT_SERVER: db
      ADMINER_DESIGN: dracula
    ports:
      - "${ADMINER_PORT:-8081}:8080"

volumes:
  pedidos_pgdata:
  pedidos_uploads:
