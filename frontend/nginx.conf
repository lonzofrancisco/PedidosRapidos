server {
  listen 80;
  server_name _;

  # Permite subir imagenes hasta ~2 MB (limite real lo aplica multer).
  client_max_body_size 3m;

  # Proxy de API al servicio "api" del compose
  location /api/ {
    proxy_pass http://api:3000/api/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Archivos subidos por la API (logos de tienda, imagenes de producto).
  # El volumen 'pedidos_uploads' esta montado read-only en este path.
  location /uploads/ {
    alias /usr/share/nginx/html/uploads/;
    expires 30d;
    add_header Cache-Control "public, max-age=2592000";
    autoindex off;
  }

  # SPA fallback
  root /usr/share/nginx/html;
  index index.html;
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Cache largo para assets versionados de Vite (filename incluye hash)
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # No cachear el HTML: si no, el navegador puede seguir apuntando al bundle
  # viejo despues de un deploy.
  location = /index.html {
    add_header Cache-Control "no-store, must-revalidate";
    expires 0;
  }
}
